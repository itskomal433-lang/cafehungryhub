<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hh-gold-linear" x1="15" y1="10" x2="85" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF4D0" />
      <stop offset="25%" stop-color="#E6C26D" />
      <stop offset="50%" stop-color="#DFAC42" />
      <stop offset="75%" stop-color="#BF8823" />
      <stop offset="100%" stop-color="#8C5B0D" />
